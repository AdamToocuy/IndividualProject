{% extends "base.html" %}

{% block content %}
<div id="carouselExampleContent" class="carousel slide">
  <div class="carousel-inner rounded-5">
    
    <!-- Первый слот с вашей картинкой новостройки -->
    <div class="carousel-item active">
      <div class="d-flex flex-column justify-content-center bg-subtle-primary p-9 bg-1 rounded-5 position-relative overflow-hidden text-white" 
          style="min-height: 320px; background-image: linear-gradient(rgba(33, 37, 41, 0.75), rgba(33, 37, 41, 0.75)), url('/static/новостроечки.jpg'); background-size: cover; background-position: center;">
          <h3>Система оценивания недвижимости</h3>
          <p class="mb-3">Оценивание стоимости вашей недвижимости, исходя из её параметров, с применением Machine Learning.</p>
          <div><a class="btn-solid theme-primary" href="/predict">Get started</a></div>
      </div>
    </div>

    <!-- Второй слот -->
    <div class="carousel-item">
      <div class="d-flex flex-column justify-content-center text-center bg-subtle-success p-9 bg-2 rounded-5" style="min-height: 320px;">
        <h3>О сайте</h3>
        <p class="fg-emphasis-secondary mb-3">Здесь вы можете ознакомиться с технической частью сайта.</p>
        <div><a class="btn-solid theme-success" href="#">Learn more</a></div>
      </div>
    </div>

  </div>

  <!-- Кнопки управления каруселью -->
  <div class="d-flex justify-content-center gap-2 mt-3">
    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleContent" data-bs-slide="prev" style="--bs-carousel-control-icon-width: 1rem;">
      <span class="carousel-icon-prev" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselExampleContent" data-bs-slide="next" style="--bs-carousel-control-icon-width: 1rem;">
      <span class="carousel-icon-next" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
{% endblock %}
